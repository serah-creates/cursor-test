<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON ROCKET RUN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0014;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const HS_KEY = 'neonRocketRunHighScore';

  // ── Layout (logical units, portrait) ──
  let W = 400, H = 700, DPR = 1;

  // ── Game state ──
  const State = { START: 0, PLAY: 1, OVER: 2 };
  let state = State.START;
  let score = 0;
  let highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10);

  // ── Physics constants (per second) ──
  const GRAVITY = 920;
  const THRUST = -340;
  const MAX_VY = 520;
  const ROCKET_R = 14;
  const ROCKET_X = 0.28;

  const BASE_GAP = 0.22;
  const MIN_GAP = 0.11;
  const BASE_SPEED = 185;
  const GAP_SHRINK = 0.04;
  const SPEED_BOOST = 0.06;
  const DIFF_EVERY = 5;

  const SPAWN_INTERVAL = 2.4;
  const NEAR_MISS_DIST = 22;

  // ── Runtime objects ──
  let rocket = { x: 0, y: 0, vy: 0, angle: 0 };
  let obstacles = [];
  let particles = [];
  let stars = [];
  let spawnTimer = 0;
  let scrollSpeed = BASE_SPEED;
  let gapRatio = BASE_GAP;
  let shake = 0;
  let flash = 0;
  let nearMissFlash = 0;
  let thrusting = false;
  let lastTime = 0;

  // ── Resize ──
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initStars();
  }

  function initStars() {
    stars = [];
    for (let layer = 0; layer < 3; layer++) {
      const count = 40 + layer * 25;
      const spd = 15 + layer * 25;
      const size = 0.8 + layer * 0.6;
      const alpha = 0.3 + layer * 0.25;
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          layer,
          spd,
          size,
          alpha,
          twinkle: Math.random() * Math.PI * 2
        });
      }
    }
  }

  // ── Difficulty ──
  function applyDifficulty() {
    const tier = Math.floor(score / DIFF_EVERY);
    gapRatio = Math.max(MIN_GAP, BASE_GAP * Math.pow(1 - GAP_SHRINK, tier));
    scrollSpeed = BASE_SPEED * Math.pow(1 + SPEED_BOOST, tier);
  }

  // ── Obstacles ──
  function spawnObstacle() {
    const gapH = gapRatio * H;
    const margin = gapH * 0.5 + 40;
    const minY = margin;
    const maxY = H - margin;
    const gapCenter = minY + Math.random() * (maxY - minY);
    obstacles.push({
      x: W + 30,
      gapCenter,
      gapH,
      scored: false,
      nearMissed: false,
      w: 52
    });
  }

  // ── Particles ──
  function spawnThrustParticle() {
    const rx = rocket.x;
    const ry = rocket.y + ROCKET_R * 0.6;
    for (let i = 0; i < 2; i++) {
      particles.push({
        x: rx + (Math.random() - 0.5) * 8,
        y: ry + Math.random() * 6,
        vx: -60 + (Math.random() - 0.5) * 80,
        vy: 80 + Math.random() * 120,
        life: 0.25 + Math.random() * 0.2,
        maxLife: 0.45,
        r: 2 + Math.random() * 3,
        color: Math.random() > 0.5 ? '#ff6ec7' : '#00f0ff'
      });
    }
  }

  function spawnCrashBurst() {
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 80 + Math.random() * 280;
      particles.push({
        x: rocket.x,
        y: rocket.y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        life: 0.4 + Math.random() * 0.6,
        maxLife: 1.0,
        r: 2 + Math.random() * 5,
        color: ['#ff006e', '#00f0ff', '#ffbe0b', '#8338ec'][Math.floor(Math.random() * 4)]
      });
    }
    shake = 14;
    flash = 0.35;
  }

  // ── Collision helpers ──
  function circleRectHit(cx, cy, cr, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx;
    const dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
  }

  function checkCollisionAt(x, y) {
    if (y - ROCKET_R < 0 || y + ROCKET_R > H) return true;
    for (const o of obstacles) {
      const topH = o.gapCenter - o.gapH / 2;
      const botY = o.gapCenter + o.gapH / 2;
      if (circleRectHit(x, y, ROCKET_R, o.x, 0, o.w, topH)) return true;
      if (circleRectHit(x, y, ROCKET_R, o.x, botY, o.w, H - botY)) return true;
    }
    return false;
  }

  function checkNearMiss(x, y) {
    for (const o of obstacles) {
      if (o.nearMissed || o.scored) continue;
      if (x < o.x || x > o.x + o.w) continue;
      const topBottom = o.gapCenter - o.gapH / 2;
      const botTop = o.gapCenter + o.gapH / 2;
      const distTop = Math.abs(y - ROCKET_R - topBottom);
      const distBot = Math.abs(y + ROCKET_R - botTop);
      if (distTop < NEAR_MISS_DIST || distBot < NEAR_MISS_DIST) {
        o.nearMissed = true;
        nearMissFlash = 0.18;
      }
    }
  }

  // ── Sub-stepped physics update (swept collision) ──
  function updatePlay(dt) {
    rocket.vy = Math.min(MAX_VY, rocket.vy + GRAVITY * dt);
    rocket.x = W * ROCKET_X;

    const moveY = Math.abs(rocket.vy * dt);
    const moveX = scrollSpeed * dt;
    const subSteps = Math.max(1, Math.ceil(Math.max(moveY, moveX) / (ROCKET_R * 0.4)));
    const step = dt / subSteps;
    const dyStep = (rocket.vy * dt) / subSteps;
    const dxStep = (scrollSpeed * dt) / subSteps;

    for (let s = 0; s < subSteps; s++) {
      for (const o of obstacles) o.x -= dxStep;
      obstacles = obstacles.filter(o => o.x + o.w > -20);

      const prevY = rocket.y;
      rocket.y += dyStep;

      if (checkCollisionAt(rocket.x, rocket.y)) {
        rocket.y = prevY;
        gameOver();
        return;
      }

      for (const o of obstacles) {
        if (!o.scored && rocket.x > o.x + o.w) {
          o.scored = true;
          score++;
          applyDifficulty();
        }
      }
      checkNearMiss(rocket.x, rocket.y);
    }

    rocket.angle = Math.max(-0.6, Math.min(0.9, rocket.vy / 400));

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = SPAWN_INTERVAL * (BASE_SPEED / scrollSpeed);
    }

    if (thrusting) spawnThrustParticle();

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 28);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
    if (nearMissFlash > 0) nearMissFlash = Math.max(0, nearMissFlash - dt * 3);
  }

  // ── Reset ──
  function resetGame() {
    score = 0;
    obstacles = [];
    particles = [];
    spawnTimer = 1.2;
    scrollSpeed = BASE_SPEED;
    gapRatio = BASE_GAP;
    shake = 0;
    flash = 0;
    nearMissFlash = 0;
    thrusting = false;
    rocket = { x: W * ROCKET_X, y: H * 0.45, vy: 0, angle: 0 };
  }

  function startGame() {
    resetGame();
    state = State.PLAY;
    rocket.vy = THRUST * 0.5;
  }

  function gameOver() {
    if (state !== State.PLAY) return;
    state = State.OVER;
    spawnCrashBurst();
    if (score > highScore) {
      highScore = score;
      localStorage.setItem(HS_KEY, String(highScore));
    }
  }

  // ── Input ──
  function flap() {
    if (state === State.START) {
      startGame();
      return;
    }
    if (state === State.OVER) {
      startGame();
      return;
    }
    if (state === State.PLAY) {
      rocket.vy = THRUST;
      thrusting = true;
      setTimeout(() => { thrusting = false; }, 80);
    }
  }

  function onInput(e) {
    if (e.type === 'keydown' && e.code !== 'Space') return;
    e.preventDefault();
    flap();
  }

  window.addEventListener('keydown', onInput);
  canvas.addEventListener('pointerdown', onInput);
  window.addEventListener('resize', resize);

  // ── Drawing ──
  function drawBackground(t, dt) {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0018');
    grad.addColorStop(0.5, '#120028');
    grad.addColorStop(1, '#1a0035');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Horizon glow
    ctx.save();
    ctx.globalAlpha = 0.15;
    const hg = ctx.createLinearGradient(0, H * 0.65, 0, H);
    hg.addColorStop(0, 'transparent');
    hg.addColorStop(1, '#ff006e');
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.65, W, H * 0.35);
    ctx.restore();

    // Grid floor (synthwave)
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = '#ff006e';
    ctx.lineWidth = 1;
    const horizon = H * 0.82;
    for (let i = -2; i < 20; i++) {
      ctx.beginPath();
      ctx.moveTo(W / 2 + (i - 8) * 40, horizon);
      ctx.lineTo(W / 2 + (i - 8) * 120, H);
      ctx.stroke();
    }
    for (let j = 0; j < 8; j++) {
      const yy = horizon + (H - horizon) * (j / 8);
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(W, yy);
      ctx.stroke();
    }
    ctx.restore();

    // Stars (parallax, 3 depth layers)
    for (const s of stars) {
      s.x -= s.spd * dt;
      if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
      const tw = 0.6 + 0.4 * Math.sin(t * 2 + s.twinkle);
      ctx.globalAlpha = s.alpha * tw;
      ctx.fillStyle = s.layer === 2 ? '#fff' : s.layer === 1 ? '#c4b5fd' : '#6b7280';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawObstacle(o) {
    const topH = o.gapCenter - o.gapH / 2;
    const botY = o.gapCenter + o.gapH / 2;

    function drawPillar(x, y, w, h) {
      ctx.save();
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 16;
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);

      const g = ctx.createLinearGradient(x, y, x + w, y + h);
      g.addColorStop(0, 'rgba(0, 240, 255, 0.08)');
      g.addColorStop(1, 'rgba(255, 0, 110, 0.12)');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);

      // Rocky edge detail
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
      ctx.lineWidth = 1;
      const edgeY = h < H * 0.5 ? y + h : y;
      ctx.beginPath();
      for (let i = 0; i < w; i += 8) {
        const jag = (Math.sin(i * 0.7 + o.x * 0.05) * 4);
        if (i === 0) ctx.moveTo(x + i, edgeY + jag);
        else ctx.lineTo(x + i, edgeY + jag);
      }
      ctx.stroke();
      ctx.restore();
    }

    drawPillar(o.x, 0, o.w, topH);
    drawPillar(o.x, botY, o.w, H - botY);
  }

  function drawRocket() {
    const { x, y, angle } = rocket;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // Glow
    ctx.shadowColor = '#ff6ec7';
    ctx.shadowBlur = 20;

    // Body
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.moveTo(ROCKET_R * 1.4, 0);
    ctx.lineTo(-ROCKET_R * 0.9, -ROCKET_R * 0.65);
    ctx.lineTo(-ROCKET_R * 0.5, 0);
    ctx.lineTo(-ROCKET_R * 0.9, ROCKET_R * 0.65);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#ff6ec7';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Window
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(ROCKET_R * 0.3, 0, ROCKET_R * 0.28, 0, Math.PI * 2);
    ctx.fill();

    // Fins
    ctx.strokeStyle = '#8338ec';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#8338ec';
    ctx.beginPath();
    ctx.moveTo(-ROCKET_R * 0.7, -ROCKET_R * 0.5);
    ctx.lineTo(-ROCKET_R * 1.1, -ROCKET_R * 0.85);
    ctx.moveTo(-ROCKET_R * 0.7, ROCKET_R * 0.5);
    ctx.lineTo(-ROCKET_R * 1.1, ROCKET_R * 0.85);
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = p.life / p.maxLife;
      ctx.globalAlpha = a;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawHUD() {
    ctx.save();
    ctx.font = 'bold 42px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    ctx.fillText(String(score), W / 2, 58);
    ctx.restore();

    ctx.save();
    ctx.font = '14px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('BEST ' + highScore, W - 16, 28);
    ctx.restore();
  }

  function drawOverlay(title, sub, sub2) {
    ctx.save();
    ctx.fillStyle = 'rgba(10, 0, 20, 0.55)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';

    // Title
    ctx.font = 'bold 36px "Segoe UI", system-ui, sans-serif';
    ctx.shadowColor = '#ff006e';
    ctx.shadowBlur = 24;
    const tg = ctx.createLinearGradient(W * 0.2, 0, W * 0.8, 0);
    tg.addColorStop(0, '#00f0ff');
    tg.addColorStop(0.5, '#ff6ec7');
    tg.addColorStop(1, '#ffbe0b');
    ctx.fillStyle = tg;
    ctx.fillText(title, W / 2, H * 0.32);

    if (sub) {
      ctx.font = '18px "Segoe UI", system-ui, sans-serif';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#8338ec';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(sub, W / 2, H * 0.42);
    }

    if (sub2) {
      ctx.font = '15px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.shadowBlur = 0;
      ctx.fillText(sub2, W / 2, H * 0.48);
    }

    // Pulsing prompt
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 350);
    ctx.globalAlpha = pulse;
    ctx.font = '16px "Segoe UI", system-ui, sans-serif';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#00f0ff';
    const prompt = state === State.OVER ? 'tap / space to retry' : 'tap / space to start';
    ctx.fillText(prompt, W / 2, H * 0.62);
    ctx.restore();
  }

  function draw(t, dt) {
    let ox = 0, oy = 0;
    if (shake > 0) {
      ox = (Math.random() - 0.5) * shake;
      oy = (Math.random() - 0.5) * shake;
    }

    ctx.save();
    ctx.translate(ox, oy);

    drawBackground(t, dt);

    for (const o of obstacles) drawObstacle(o);
    drawParticles();
    if (state !== State.START) drawRocket();

    if (state === State.PLAY) drawHUD();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 0, 110, ${flash * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (nearMissFlash > 0) {
      ctx.fillStyle = `rgba(0, 240, 255, ${nearMissFlash * 0.25})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === State.START) {
      drawOverlay('NEON ROCKET RUN', null, null);
    } else if (state === State.OVER) {
      drawHUD();
      drawOverlay('CRASHED', 'Score: ' + score, 'Best: ' + highScore);
    }

    ctx.restore();
  }

  // ── Main loop ──
  function loop(now) {
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.05);

    if (state === State.PLAY) {
      updatePlay(dt);
    } else {
      // Ambient star drift + particle decay on overlays
      for (const s of stars) {
        s.x -= s.spd * dt * 0.3;
        if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
        else {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
        }
      }
      if (shake > 0) shake = Math.max(0, shake - dt * 28);
      if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
    }

    draw(now / 1000, dt);
    requestAnimationFrame(loop);
  }

  resize();
  rocket.x = W * ROCKET_X;
  rocket.y = H * 0.45;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
